      (function () {
        try {
          var theme = localStorage.getItem('hd2-theme') || localStorage.getItem('agcore_demo_theme');
          if (theme !== 'dark' && theme !== 'light') theme = 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#0B1020' : '#FAFAFD');
        } catch (e) { /* storage unavailable: the light default still applies */ }
      })();
    </script>
